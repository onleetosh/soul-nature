# Render Blueprint: https://render.com/docs/blueprint-spec
# If Render assigns different .onrender.com URLs (names taken), update
# CORS_ORIGINS / FRONTEND_URL on the API and NEXT_PUBLIC_API_URL on the web
# service, then redeploy the web service (NEXT_PUBLIC_* is baked in at build).
services:
  - type: web
    name: soul-nature-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      # Any PostgreSQL connection string, e.g. from Neon (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://soul-nature-web.onrender.com"]'
      - key: FRONTEND_URL
        value: https://soul-nature-web.onrender.com
      - key: ADMIN_TOKEN
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: soul-nature-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://soul-nature-api.onrender.com
